
[project]
name = "mnk"
version = "0.1.0"
description = ""
authors = [
    {name = "Kim Leirvik",email = "kim.leirvik@niva.no"}
]
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "geoalchemy2>=0.18.1",
    "geopandas>=1.1.2",
    "lxml>=6.0.2",
    "matplotlib>=3.10.8",
    "psycopg2-binary>=2.9.11",
    "pyarrow>=23.0.0",
    "rasterio>=1.4.4",
    "shapely>=2.1.2",
    "scikit-learn==1.7.1",
    "sqlalchemy>=2.0.46",
    "xdem>=0.2.2",
    "xgboost (>=3.2.0,<4.0.0)",
    "scipy>=1.10",
    "gdal (>=3.12.2,<4.0.0)",
    "isort >=8.0.0",
    "black >=26.3.0",
    "nbqa >=1.9.1",
    "ipykernel >=7.2.0",
    "copernicusmarine>=2.2.3,<3",
    "xarray>=2024.1.0",
    "numpy>=1.24",
]


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "mnk"}]

[tool.black]
line-length = 120
target_version = ['py310']
include = '\.py$'


[tool.isort]
line_length=120                # corresponds to -w  flag
multi_line_output=3            # corresponds to -m  flag
include_trailing_comma=true    # corresponds to -tc flag
skip_glob = '^((?!py$).)*$'    # this makes sort all Python files


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
mnk = { path = ".", editable = true }
geopandas = ">=1"
geoutils = ">=0.2"

[tool.pixi.tasks]
labelling = "papermill notebooks/01_substrat_labelling.ipynb notebooks/01_substrat_labelling.ipynb"
modelling = "papermill notebooks/02_substrat_modelling.ipynb notebooks/02_substrat_modelling.ipynb"
predict = "papermill notebooks/03_substrat_predict.ipynb notebooks/03_substrat_predict.ipynb"
postprocess = "papermill notebooks/04_substrat_postprocess.ipynb notebooks/04_substrat_postprocess.ipynb"
validate = "papermill notebooks/05_substrat_validate.ipynb notebooks/05_substrat_validate.ipynb"
install-kernel = "python scripts/install_kernel.py"
dump-features = "papermill notebooks/dump_features.ipynb notebooks/dump_features.ipynb"

[tool.pixi.dependencies]
scikit-learn = "==1.7.1"
sqlite = ">=3.38"
libgdal-arrow-parquet = ">=3.12.2,<4"
libgdal-pg = ">=3.12.2,<4"
pytest = ">=9.0.2,<10"
papermill = ">=2.7.0,<3"
grass = ">=8"
rasterstats = ">=0.19"

